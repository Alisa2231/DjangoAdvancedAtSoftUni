<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand brand-logo" href="{% url 'home' %}">
                <span class="brand-icon">
                    <i class="bi bi-trophy-fill"></i>
                </span>
                <span>SOFTUNI <strong>CUP</strong></span>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'teams:list' %}">Teams</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{%  url 'games:list' %}">Games</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'games:standings' %}">Standings</a>
                    </li>

                    {% if user.is_authenticated %}
                        <li class="nav-item ms-lg-2">
                            <a href="{% url 'accounts:profile' pk=user.id %}" class="btn btn-accent btn-sm px-4">
                                Profile
                            </a>
                        </li>
                        <form method="post" action="{% url 'accounts:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-accent btn-sm px-4">Log Out</button>
                        </form>
                    {% else %}
                        <li class="nav-item ms-lg-2">
                            <a href="{% url 'accounts:login' %}" class="btn btn-accent btn-sm px-4">
                                Login
                            </a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <a href="{% url 'accounts:registration' %}" class="btn btn-accent btn-sm px-4">
                                Register
                            </a>
                        </li>
                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>
</header>
