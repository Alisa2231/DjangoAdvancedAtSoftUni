{% extends 'common/base.html' %}

{% block content %}
    <div class="form-card mx-auto">
        <form class='m-4 text-center' method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="alert alert-danger" role="alert">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}
            {% for field in form %}
                <label class="form-label" for="{{ field.id_for_label }}">
                    {{ field.label }}
    {#                {% if field.name == 'name' or field.name == 'city' or field.name == 'coach_name' %}#}
    {#                    <span class="required-star">*</span>#}
    {#                {% endif %}#}
                </label>
                <p>{{ field }}</p>
                {% for error in field.errors %}
                    <div class="invalid-feedback d-block">
                        {{ error }}
                    </div>
                {% endfor %}
            {% endfor %}
            <button class="btn btn-accent btn-sm px-4" type="submit">Register</button>
            <p><small class="m-4">Already registered? Sign in <a href="{% url 'accounts:login' %}">here</a>.</small></p>
        </form>
    </div>


{% endblock %}
